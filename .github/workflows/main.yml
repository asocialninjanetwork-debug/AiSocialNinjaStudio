            - name: secret-scanning-custom-action
  # You may pin to the exact commit or the version.
  # uses: advanced-security/secret-scanning-tools@07ac4be45c732c127699be05eaa3ecc27d92c77e
  uses: advanced-security/secret-scanning-tools@v1
  with:
    # Repository owner and repo name
    repository: # optional, default is ${{ github.repository }}
    # GitHub Personal Access Token
    token: # optional, default is ${{ github.token }}
    # Secret Scanning Test Suite Mode
    mode: # optional, default is validate
    # Path to template directory
    templates-path: # optional
    # Main README template name
    template-main: # optional
    # PATTERNS template name
    template-patterns: # optional
    # Path to scan
    path: # optional, default is ${{ github.workspace }}
    # Additional arguments
    argvs: # optional
          
