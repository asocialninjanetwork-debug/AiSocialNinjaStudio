Step 1: Build your project
name: Build Project
  run: |
    cd backend && npm install && npm run build
    cd ../frontend && npm install && npm run build

Step 2: Run pipeline and generate artifacts with proper configuration
name: Run Pipeline and Generate Digests
  id: hash
  run: |
    set -euo pipefail
    npx ts-node src/pipelineComponents.ts
    # List generated artifacts for provenance
    files=$(ls backend/dist/* frontend/dist/* output/*)
    # Generate base64-encoded SHA256 digests for all artifacts
    echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

Step 3: Upload generated outputs
name: Upload Build Artifacts
  uses: actions/upload-artifact@v4
  with:
    name: pipeline-and-build-outputs
    path: |
      backend/dist/
      frontend/dist/
      output/
    retention-days: 30
    if-no-files-found: warn

This workflow lets you generate SLSA provenance file for your project.
The generation satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
The project is an initiative of the OpenSSF (openssf.org) and is developed at
https://github.com/slsa-framework/slsa-github-generator.
The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
uses: actions/checkout@v4

      # ========================================================
      #
      # Step 1: Build your artifacts.
      #
      # ========================================================
name: Build artifacts
        run: |
            # These are some amazing artifacts.
            echo "artifact1" > artifact1
            echo "artifact2" > artifact2

      # ========================================================
      #
      # Step 2: Generate the provenance subjects with SHA256 sums
      #
      # ========================================================
name: Generate subject for provenance
        id: hash
        run: | 
          set -euo pipefail
          files=$(ls artifact*)
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"
 
  provenance: 
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generatorgenericslsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Optional: Upload to a new release
