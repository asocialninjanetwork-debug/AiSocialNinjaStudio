Step 1: Build your project
name: Build Project
  run: |
    cd backend && npm install && npm run build
    cd ../frontend && npm install && npm run build
on:
  push:
    branches:
    - main
    - release/*
Step 2: Run pipeline and generate artifacts with proper configuration
name: Run Pipeline and Generate Digests
  id: hash
  run: |
    set -euo pipefail
    npx ts-node src/pipelineComponents.ts
    # List generated artifacts for provenance
    files=$(ls backend/dist/* frontend/dist/* output/*)
    # Generate base64-encoded SHA256 digests for all artifacts
    echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"
on:
  pull_request:
    branches:
    - main
Step 3: Upload generated outputs
name: Upload Build Artifacts
  uses: actions/upload-artifact@v4
  with:
    name: pipeline-and-build-outputs
    path: |
      backend/dist/
      frontend/dist/
      output/
    retention-days: 30
    if-no-files-found: warn
on:
  schedule:
  - cron: "0 2 * * 1-5"
